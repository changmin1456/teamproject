name: Python check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile
